app = "arag-research-portal"
primary_region = "syd"

[build]

[env]
  PORT = "8787"
  BINDINGS_PATH = "/app/data/bindings.json"
  TENANTS_PATH = "/app/data/tenants.json"
  KG_PROPOSALS_PATH = "/app/data/kg-proposals.json"
  BRANDING_PATH = "/app/data/branding"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays up so scheduled source syncs and saved-search checks run
  # daily without waiting for a visitor to wake the app.
  min_machines_running = 1

  # /api/health only returns 200 when apps/web/dist/index.html exists (see
  # apps/api/src/app.ts), so an image built without the web bundle fails this
  # check and never goes live - the guard for the outage this fixes.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/api/health"

[mounts]
  source = "rp_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
