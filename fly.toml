app = "arag-research-portal"
primary_region = "syd"

[build]

[env]
  PORT = "8787"
  BINDINGS_PATH = "/app/data/bindings.json"
  TENANTS_PATH = "/app/data/tenants.json"
  KG_PROPOSALS_PATH = "/app/data/kg-proposals.json"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "rp_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
