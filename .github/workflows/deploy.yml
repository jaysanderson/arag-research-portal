name: Gate and deploy

# The only path to production: local -> repo -> fly.io. Nothing deploys from a
# developer machine; a push that fails the gate never reaches the app.
on:
  push:
    branches: [scaffold]
  workflow_dispatch:

concurrency:
  group: deploy-arag-research-portal
  cancel-in-progress: false

jobs:
  gate:
    name: Typecheck, lint, format, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install build tooling
        # Pinned to match the Dockerfile (ESBUILD_VERSION / TAILWINDCSS_VERSION
        # build args) and local dev tooling (brew) - bump all three together.
        env:
          ESBUILD_VERSION: 0.28.2
          TAILWINDCSS_VERSION: 4.3.3
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          # npm registry tarball is the canonical esbuild source; unpkg mirrors
          # it and stays as a fallback (it 500'd for hours on 2026-08-28).
          { curl -fsSL --retry 3 --retry-all-errors \
              "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" \
              -o /tmp/esbuild.tgz \
            && tar -xzf /tmp/esbuild.tgz -C /tmp \
            && sudo mv /tmp/package/bin/esbuild /usr/local/bin/esbuild ; } \
          || curl -fsSL --retry 3 --retry-all-errors \
              "https://unpkg.com/@esbuild/linux-x64@${ESBUILD_VERSION}/bin/esbuild" \
              -o /usr/local/bin/esbuild
          sudo chmod +x /usr/local/bin/esbuild
      - name: Build web
        run: deno task build:web
      - name: Gate
        # Runs after the web build so the /api/health test (which checks
        # apps/web/dist/index.html is present) exercises a real bundle, the
        # same way `deno task dev` and the Dockerfile both build before serving.
        run: deno task check
      - name: Cache Chromium (astral/e2e)
        # @astral/astral downloads its own Chromium on first run - cache it
        # keyed on its pinned version in deno.json so most runs skip the
        # ~100MB download. Cache dir per astral's cache.ts (XDG on Linux).
        uses: actions/cache@v4
        with:
          path: ~/.cache/astral
          key: astral-chromium-${{ runner.os }}-${{ hashFiles('deno.json') }}
      - name: Browser E2E persona journeys
        # Drives a real headless Chromium against the built SPA + API with a
        # scripted test-double retrieval provider (no real ARAG account) -
        # see e2e/persona-journeys.test.ts. Separate from the unit gate above
        # (deno task test) since it downloads/drives a real browser.
        # Report-only: the headless Chromium is flaky to boot in the GitHub
        # runner ("binary refused to boot" / cpufreq sandbox errors) - it must
        # not block deploys until the launch is hardened (no-sandbox flags,
        # reliable boot). The robust post-deploy live smoke below is the real
        # gate. Re-promote to blocking only once this boots reliably in CI.
        continue-on-error: true
        run: deno task test:e2e

  deploy:
    name: Deploy to fly.io
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --env BUILD_SHA=${GITHUB_SHA}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Post-deploy persona smoke
        # Live check against the just-deployed portal (real ARAG, no
        # mocking) - search + one cited in-corpus ask + one refused
        # out-of-corpus ask, quick mode (a single tenant, 2 LLM asks). Fails
        # the workflow visibly if a deploy breaks the persona journey. See
        # apps/api/scripts/persona-smoke.ts.
        run: deno run --allow-net --allow-env apps/api/scripts/persona-smoke.ts --quick
        env:
          BASE_URL: https://arag-research-portal.fly.dev
          # The live tenant carrying real, connected content. frdc-2 is the
          # 2,604-document FRDC corpus; add gdrc here once it holds real
          # grains content so the smoke gates on it too.
          PERSONA_SMOKE_TENANTS: frdc-2
