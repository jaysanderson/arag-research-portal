name: Gate and deploy

# The only path to production: local -> repo -> fly.io. Nothing deploys from a
# developer machine; a push that fails the gate never reaches the app.
on:
  push:
    branches: [scaffold]
  workflow_dispatch:

concurrency:
  group: deploy-arag-research-portal
  cancel-in-progress: false

jobs:
  gate:
    name: Typecheck, lint, format, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install build tooling
        # Pinned to match the Dockerfile (ESBUILD_VERSION / TAILWINDCSS_VERSION
        # build args) and local dev tooling (brew) - bump all three together.
        env:
          ESBUILD_VERSION: 0.28.2
          TAILWINDCSS_VERSION: 4.3.3
        run: |
          curl -fsSL "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          curl -fsSL "https://unpkg.com/@esbuild/linux-x64@${ESBUILD_VERSION}/bin/esbuild" \
            -o /usr/local/bin/esbuild
          sudo chmod +x /usr/local/bin/esbuild
      - name: Build web
        run: deno task build:web
      - name: Gate
        # Runs after the web build so the /api/health test (which checks
        # apps/web/dist/index.html is present) exercises a real bundle, the
        # same way `deno task dev` and the Dockerfile both build before serving.
        run: deno task check

  deploy:
    name: Deploy to fly.io
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
